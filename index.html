<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Portal - Personal Clipboard Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons for clean UI -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Local runtime config (SUPABASE URL + anon key) -->
    <script src="config.js"></script>
    <style>
        .card-hover-dim:hover .card-content { opacity: 0.4; }
        .copy-overlay { opacity: 0; pointer-events: none; transition: all 0.2s ease; }
        .card-hover-dim:hover .copy-overlay { opacity: 1; }
        .google-logo { display: inline-block; width: 20px; height: 20px; margin-right: 12px; vertical-align: middle; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="hidden flex-1 flex items-center justify-center p-6">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-xl p-10 w-full max-w-sm text-center">
            <div class="bg-indigo-600 text-white p-3 rounded-2xl shadow-md shadow-indigo-100 inline-flex mb-5">
                <i data-lucide="clipboard-copy" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-1">Copy Portal</h1>
            <p class="text-sm text-slate-500 mb-8">Sign in with Google to access your private snippet vault.</p>
            <button onclick="window.portal.signInWithGoogle()" id="loginButton" class="flex items-center justify-center w-full bg-white border border-slate-300 hover:border-slate-400 hover:bg-slate-50 text-slate-700 font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition-all cursor-pointer">
                <svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.05 5.05 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>
            <p id="loginError" class="hidden mt-4 text-xs font-medium text-rose-600"></p>
        </div>
    </div>

    <!-- APP SHELL -->
    <div id="appShell" class="hidden flex-1 flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-100">
                <i data-lucide="clipboard-copy" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">Copy Portal</h1>
                <p class="text-xs text-slate-500">Your personal snippet vault</p>
            </div>
        </div>

        <!-- Search & Actions -->
        <div class="flex items-center gap-3 w-full sm:w-auto flex-1 max-w-xl justify-end">
            <div class="relative w-full max-w-xs">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" oninput="window.portal.setSearch(this.value)" placeholder="Search snippets or tags..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border-0 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
            <button onclick="window.portal.openModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition-colors cursor-pointer shrink-0">
                <i data-lucide="plus" class="w-4 h-4"></i> New
            </button>
            <div class="flex items-center gap-2 shrink-0">
                <img id="userAvatar" alt="Google avatar" class="w-9 h-9 rounded-full border border-slate-200" />
                <button onclick="window.portal.signOut()" id="logoutButton" title="Sign out" class="p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-slate-50 transition-colors cursor-pointer">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex flex-1">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-slate-200 p-6 hidden md:flex flex-col gap-6 shrink-0">
            <!-- Navigation Filters -->
            <div class="flex flex-col gap-1">
                <button onclick="window.portal.setFilter('all')" id="filter-all" class="flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium bg-slate-100 text-indigo-600 w-full text-left transition-all cursor-pointer">
                    <span class="flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4"></i> All Snippets</span>
                    <span id="count-all" class="text-xs bg-white text-slate-600 px-2 py-0.5 rounded-full border border-slate-200 font-bold">0</span>
                </button>
                <button onclick="window.portal.setFilter('favorites')" id="filter-favorites" class="flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 w-full text-left transition-all cursor-pointer">
                    <span class="flex items-center gap-2"><i data-lucide="heart" class="w-4 h-4"></i> Favorites</span>
                    <span id="count-favorites" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>

            <hr class="border-slate-200">

            <!-- Folders Section -->
            <div>
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 px-3">Folders</h3>
                <div id="folderList" class="flex flex-col gap-1 max-h-48 overflow-y-auto">
                    <!-- Dynamic Folders -->
                </div>
            </div>

            <hr class="border-slate-200">

            <!-- Tags Section -->
            <div>
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 px-3">Tags</h3>
                <div id="tagList" class="flex flex-wrap gap-1.5 px-2">
                    <!-- Dynamic Tags -->
                </div>
            </div>
        </aside>

        <!-- MAIN GRID AREA -->
        <main class="flex-1 p-6 md:p-8">
            <!-- Active Filter Indicator Banner -->
            <div id="filterBanner" class="mb-6 hidden items-center justify-between bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2.5 text-sm text-indigo-800">
                <span id="filterBannerText">Viewing active filter</span>
                <button onclick="window.portal.clearFilters()" class="text-xs font-bold underline hover:text-indigo-900 cursor-pointer">Clear Filters</button>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="bg-slate-100 p-4 rounded-2xl text-slate-400 mb-4">
                    <i data-lucide="folder-open" class="w-10 h-10"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-800 mb-1">No snippets found</h3>
                <p class="text-sm text-slate-500 max-w-xs">Create a new copy item or adjust your filters to get started.</p>
            </div>

            <!-- Cards Grid -->
            <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Snippet cards dynamic insertion -->
            </div>
        </main>
    </div>

    <!-- DIALOG MODAL (Add/Edit) -->
    <div id="snippetModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-xl overflow-hidden border border-slate-100 transform transition-all">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <h2 id="modalTitle" class="text-lg font-bold text-slate-900">New Snippet</h2>
                <button onclick="window.portal.closeModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer p-1 rounded-lg hover:bg-slate-50">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="snippetForm" onsubmit="window.portal.handleFormSubmit(event)" class="p-6 flex flex-col gap-4">
                <input type="hidden" id="snippetId">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Title</label>
                    <input type="text" id="formTitle" required placeholder="e.g., Git Undo Commit" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Folder / Sub-folder</label>
                    <input type="text" id="formFolder" placeholder="e.g., github/git-tricks" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Content</label>
                    <textarea id="formContent" required rows="5" placeholder="Paste your text, code snippet, or prompt here..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Tags (comma separated)</label>
                    <input type="text" id="formTags" placeholder="e.g., git, terminal, workflow" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="formFavorite" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                    <label for="formFavorite" class="text-sm text-slate-700 cursor-pointer">Mark as Favorite</label>
                </div>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-100">
                    <button type="button" onclick="window.portal.closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-sm cursor-pointer">Save Snippet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- VIEW LONG TEXT MODAL -->
    <div id="viewModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col max-h-[85vh]">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h2 id="viewModalTitle" class="text-lg font-bold text-slate-900">View Content</h2>
                <div class="flex items-center gap-2">
                    <button id="viewModalCopyBtn" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold cursor-pointer">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Content
                    </button>
                    <button onclick="window.portal.closeViewModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer p-1 rounded-lg hover:bg-slate-100">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div class="p-6 overflow-y-auto bg-slate-900 text-slate-100 font-mono text-sm whitespace-pre-wrap select-all selection:bg-indigo-500/30" id="viewModalContent"></div>
        </div>
    </div>

    </div><!-- /appShell -->

    <!-- CONTROLLER JAVASCRIPT -->
    <script>
        class CopyPortal {
            constructor() {
                this.supabase = window.supabase.createClient(
                    window.SUPABASE_CONFIG.url,
                    window.SUPABASE_CONFIG.anonKey
                );
                this.session = null;
                this.user = null;
                this.snippets = [];
                this.currentFilter = 'all'; // 'all', 'favorites', 'tag:name', 'folder:name'
                this.searchQuery = '';
                this.init();
            }

            async init() {
                // Restore an existing session automatically (this is the "auto-login": no click needed if already signed in, including after Google redirect)
                const { data: { session }, error } = await this.supabase.auth.getSession();
                if (error) console.error('getSession error', error.message);
                this.applySession(session);

                // React to later auth changes (sign-in / sign-out / token refresh)
                this.supabase.auth.onAuthStateChange((_event, session) => {
                    this.applySession(session);
                });
            }

            async applySession(session) {
                this.session = session;
                this.user = session ? session.user : null;

                if (this.user) {
                    this.showApp();
                    this.setUserBadge();
                    await this.loadSnippets();
                } else {
                    this.showLogin();
                }
                lucide.createIcons();
            }

            // ---------- AUTH UI ----------

            showLogin() {
                if (window.location.hash === '#auth') history.replaceState(null, '', window.location.pathname);
                document.getElementById('appShell').classList.add('hidden');
                document.getElementById('appShell').classList.remove('flex');
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('loginScreen').classList.add('flex');
            }

            showApp() {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('flex');
                document.getElementById('appShell').classList.remove('hidden');
                document.getElementById('appShell').classList.add('flex');
            }

            setUserBadge() {
                const avatar = document.getElementById('userAvatar');
                const meta = (this.user && this.user.user_metadata) || {};
                if (meta.avatar_url) {
                    avatar.src = meta.avatar_url;
                } else if (meta.picture) {
                    avatar.src = meta.picture;
                } else {
                    avatar.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                        `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="36" height="36" rx="18" fill="#e2e8f0"/><text x="18" y="24" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">${(meta.full_name || this.user.email || 'U')[0].toUpperCase()}</text></svg>`
                    );
                }
            }

            async signInWithGoogle() {
                const btn = document.getElementById('loginButton');
                btn.disabled = true;
                document.getElementById('loginError').classList.add('hidden');

                const { error } = await this.supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.SUPABASE_CONFIG.redirectTo }
                });

                btn.disabled = false;
                if (error) {
                    const errEl = document.getElementById('loginError');
                    errEl.innerText = 'Sign-in failed: ' + error.message;
                    errEl.classList.remove('hidden');
                }
            }

            async signOut() {
                await this.supabase.auth.signOut();
                this.snippets = [];
                this.render();
            }

            // ---------- DATA ----------

            async loadSnippets() {
                const { data, error } = await this.supabase
                    .from('snippets')
                    .select('*')
                    .order('updated_at', { ascending: false });

                if (error) {
                    console.error('Failed to load snippets:', error.message);
                    this.snippets = [];
                } else {
                    this.snippets = data || [];
                }
                this.render();
            }

            toggleFilterPresets() {
                this.render();
            }

            setSearch(val) {
                this.searchQuery = val.toLowerCase().trim();
                this.render();
            }

            setFilter(type, value = '') {
                this.currentFilter = value ? `${type}:${value}` : type;
                this.render();
            }

            clearFilters() {
                this.currentFilter = 'all';
                document.getElementById('searchInput').value = '';
                this.searchQuery = '';
                this.render();
            }

            openModal(id = null) {
                const modal = document.getElementById('snippetModal');
                const form = document.getElementById('snippetForm');
                form.reset();
                document.getElementById('snippetId').value = '';

                if (id) {
                    const snip = this.snippets.find(s => s.id === id);
                    if (snip) {
                        document.getElementById('modalTitle').innerText = 'Edit Snippet';
                        document.getElementById('snippetId').value = snip.id;
                        document.getElementById('formTitle').value = snip.title;
                        document.getElementById('formFolder').value = snip.folder || '';
                        document.getElementById('formContent').value = snip.content;
                        document.getElementById('formTags').value = snip.tags.join(', ');
                        document.getElementById('formFavorite').checked = !!snip.favorite;
                    }
                } else {
                    document.getElementById('modalTitle').innerText = 'New Snippet';
                }
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }

            closeModal() {
                const modal = document.getElementById('snippetModal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }

            openViewModal(id) {
                const snip = this.snippets.find(s => s.id === id);
                if (!snip) return;

                document.getElementById('viewModalTitle').innerText = snip.title;
                const contentArea = document.getElementById('viewModalContent');
                contentArea.textContent = snip.content;
                
                const copyBtn = document.getElementById('viewModalCopyBtn');
                copyBtn.onclick = () => this.copyToClipboard(snip.content, copyBtn);
                
                const modal = document.getElementById('viewModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                lucide.createIcons();
            }

            closeViewModal() {
                const modal = document.getElementById('viewModal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }

            async handleFormSubmit(e) {
                e.preventDefault();
                const id = document.getElementById('snippetId').value;
                const tags = document.getElementById('formTags').value
                    .split(',')
                    .map(t => t.trim().toLowerCase())
                    .filter(t => t.length > 0);

                const payload = {
                    title: document.getElementById('formTitle').value.trim(),
                    folder: document.getElementById('formFolder').value.trim().replace(/\/$/, ''),
                    content: document.getElementById('formContent').value,
                    tags: tags,
                    favorite: document.getElementById('formFavorite').checked,
                    updated_at: new Date().toISOString()
                };

                if (id) {
                    const { error } = await this.supabase
                        .from('snippets')
                        .update(payload)
                        .eq('id', id);
                    if (error) {
                        alert('Update failed: ' + error.message);
                        return;
                    }
                    this.snippets = this.snippets.map(s => s.id === id ? { ...s, ...payload } : s);
                } else {
                    const { data, error } = await this.supabase
                        .from('snippets')
                        .insert({ ...payload, user_id: this.user.id })
                        .select();
                    if (error) {
                        alert('Create failed: ' + error.message);
                        return;
                    }
                    this.snippets.unshift(data[0]);
                }

                this.render();
                this.closeModal();
            }

            async deleteSnippet(id, event) {
                event.stopPropagation();
                if (confirm('Are you sure you want to delete this item?')) {
                    const { error } = await this.supabase
                        .from('snippets')
                        .delete()
                        .eq('id', id);
                    if (error) {
                        alert('Delete failed: ' + error.message);
                        return;
                    }
                    this.snippets = this.snippets.filter(s => s.id !== id);
                    this.render();
                }
            }

            async toggleFavorite(id, event) {
                event.stopPropagation();
                const target = this.snippets.find(s => s.id === id);
                if (!target) return;
                const next = !target.favorite;
                const { error } = await this.supabase
                    .from('snippets')
                    .update({ favorite: next, updated_at: new Date().toISOString() })
                    .eq('id', id);
                if (error) {
                    alert('Update failed: ' + error.message);
                    return;
                }
                this.snippets = this.snippets.map(s => s.id === id ? { ...s, favorite: next } : s);
                this.render();
            }

            async copyToClipboard(text, element) {
                try {
                    await navigator.clipboard.writeText(text);
                    
                    // Card Dim & Checkmark Logic
                    const overlay = element.querySelector('.copy-overlay');
                    const innerIcon = element.querySelector('.copy-icon');
                    
                    if (overlay) {
                        overlay.innerHTML = '<div class="bg-emerald-500 text-white p-4 rounded-full shadow-lg"><i data-lucide="check" class="w-8 h-8"></i></div>';
                        overlay.style.opacity = '1';
                        element.classList.add('opacity-50');
                        lucide.createIcons();
                        
                        setTimeout(() => {
                            overlay.style.opacity = '';
                            element.classList.remove('opacity-50');
                            overlay.innerHTML = '<div class="bg-indigo-600 text-white p-4 rounded-full shadow-lg"><i data-lucide="copy" class="w-8 h-8"></i></div>';
                            lucide.createIcons();
                        }, 1200);
                    } else {
                        // Modal Context copy button feedback
                        const originalText = element.innerHTML;
                        element.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> Copied!';
                        element.classList.replace('bg-indigo-600', 'bg-emerald-600');
                        lucide.createIcons();
                        setTimeout(() => {
                            element.innerHTML = originalText;
                            element.classList.replace('bg-emerald-600', 'bg-indigo-600');
                            lucide.createIcons();
                        }, 1500);
                    }
                } catch (err) {
                    alert('Failed to copy text safely.');
                }
            }

            render() {
                const grid = document.getElementById('cardsGrid');
                const empty = document.getElementById('emptyState');
                const banner = document.getElementById('filterBanner');
                const bannerText = document.getElementById('filterBannerText');

                // Filter & Search calculations
                let filtered = this.snippets.filter(s => {
                    // Filter Context matches
                    if (this.currentFilter === 'favorites' && !s.favorite) return false;
                    if (this.currentFilter.startsWith('tag:')) {
                        const targetTag = this.currentFilter.split(':')[1];
                        if (!(s.tags || []).includes(targetTag)) return false;
                    }
                    if (this.currentFilter.startsWith('folder:')) {
                        const targetFolder = this.currentFilter.split(':')[1];
                        if (s.folder !== targetFolder && !(s.folder || '').startsWith(targetFolder + '/')) return false;
                    }

                    // Search Context matches
                    if (this.searchQuery) {
                        const matchTitle = (s.title || '').toLowerCase().includes(this.searchQuery);
                        const matchContent = (s.content || '').toLowerCase().includes(this.searchQuery);
                        const matchTags = (s.tags || []).some(t => t.toLowerCase().includes(this.searchQuery));
                        const matchFolder = s.folder && s.folder.toLowerCase().includes(this.searchQuery);
                        return matchTitle || matchContent || matchTags || matchFolder;
                    }
                    return true;
                });

                // Update Counters & Banners UI
                document.getElementById('count-all').innerText = this.snippets.length;
                document.getElementById('count-favorites').innerText = this.snippets.filter(s => s.favorite).length;
                
                // Highlight active button in sidebar
                document.querySelectorAll('aside button').forEach(b => b.classList.remove('bg-slate-100', 'text-indigo-600'));
                if (this.currentFilter === 'all' || this.currentFilter === 'favorites') {
                    document.getElementById(`filter-${this.currentFilter}`).classList.add('bg-slate-100', 'text-indigo-600');
                    banner.classList.replace('flex', 'hidden');
                } else {
                    banner.classList.replace('hidden', 'flex');
                    bannerText.innerText = `Active Filter: ${this.currentFilter.replace(':', ' → ')}`;
                }

                // Compile Sidebar tags & folders lists dynamically
                this.renderSidebarElements();

                // Build main layout cards
                grid.innerHTML = '';
                if (filtered.length === 0) {
                    empty.classList.replace('hidden', 'flex');
                    return;
                }
                empty.classList.replace('flex', 'hidden');

                filtered.forEach(snip => {
                    const isLong = snip.content.length > 200;
                    const displayContent = isLong ? snip.content.substring(0, 180) + '...' : snip.content;
                    const escForAttr = (str) => str.replace(/`/g, '\\`').replace(/\${/g, '\\${');

                    const card = document.createElement('div');
                    card.className = "bg-white border border-slate-200 rounded-2xl p-5 relative shadow-xs hover:shadow-md transition-all duration-200 card-hover-dim flex flex-col justify-between group min-h-[180px] cursor-pointer";
                    card.setAttribute('onclick', `window.portal.copyToClipboard(\`${escForAttr(snip.content)}\`, this)`);

                    card.innerHTML = `
                        <!-- Absolute Interactive elements overlaying dim zone -->
                        <div class="copy-overlay absolute inset-0 flex items-center justify-center bg-slate-900/5 rounded-2xl transition-all duration-200 z-10">
                            <div class="bg-indigo-600 text-white p-4 rounded-full shadow-lg"><i data-lucide="copy" class="w-8 h-8"></i></div>
                        </div>

                        <div class="card-content transition-all duration-200 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-start justify-between gap-2 mb-2">
                                    <div class="overflow-hidden">
                                        <h4 class="font-bold text-slate-900 text-base tracking-tight truncate">${snip.title}</h4>${snip.folder ? `<span class="inline-flex items-center text-xs font-semibold text-slate-400 gap-1"><i data-lucide="folder" class="w-3 h-3"></i>${snip.folder}</span>` : ''}
                                    </div>
                                    <div class="flex items-center gap-1 relative z-20">
                                        <button onclick="window.portal.toggleFavorite('${snip.id}', event)" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-50 transition-colors cursor-pointer">
                                            <i data-lucide="heart" class="w-4 h-4 ${snip.favorite ? 'fill-rose-500 text-rose-500' : ''}"></i>
                                        </button>
                                        <button onclick="event.stopPropagation(); window.portal.openModal('${snip.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer">
                                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                                        </button>
                                        <button onclick="window.portal.deleteSnippet('${snip.id}', event)" class="p-1.5 rounded-lg text-slate-400 hover:text-amber-600 hover:bg-slate-50 transition-colors cursor-pointer">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                                <p class="text-slate-600 font-mono text-xs whitespace-pre-wrap break-all">${displayContent}</p>
                            </div>
                            
                            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2 relative z-20">
                                <div class="flex flex-wrap gap-1 overflow-hidden max-h-6">
                                    ${(snip.tags || []).map(t => `<span onclick="event.stopPropagation(); window.portal.setFilter('tag', '${t}')" class="px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] font-bold rounded-md hover:bg-indigo-50 hover:text-indigo-600 transition-colors">${t}</span>`).join('')}
                                </div>
                                ${isLong ? `
                                    <button onclick="event.stopPropagation(); window.portal.openViewModal('${snip.id}')" class="text-[11px] font-bold text-indigo-600 hover:text-indigo-800 shrink-0 flex items-center gap-0.5 cursor-pointer bg-indigo-50 px-2 py-0.5 rounded-md">
                                        Expand <i data-lucide="maximize-2" class="w-2.5 h-2.5"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                lucide.createIcons();
            }

            renderSidebarElements() {
                const tagList = document.getElementById('tagList');
                const folderList = document.getElementById('folderList');

                // Compute unique tags & frequencies
                const tagsMap = {};
                const foldersMap = {};

                this.snippets.forEach(s => {
                    (s.tags || []).forEach(t => tagsMap[t] = (tagsMap[t] || 0) + 1);
                    if (s.folder) {
                        foldersMap[s.folder] = (foldersMap[s.folder] || 0) + 1;
                    }
                });

                // Render dynamic Folders layout
                folderList.innerHTML = Object.keys(foldersMap).length === 0 
                    ? '<p class="text-xs text-slate-400 px-3 italic">No folders active</p>' 
                    : '';
                Object.entries(foldersMap).sort().forEach(([folder, count]) => {
                    const btn = document.createElement('button');
                    const isActive = this.currentFilter === `folder:${folder}`;
                    btn.className = `flex items-center justify-between px-3 py-1.5 rounded-lg text-xs font-medium w-full text-left transition-all cursor-pointer ${isActive ? 'bg-slate-100 text-indigo-600 font-bold' : 'text-slate-600 hover:bg-slate-50'}`;
                    btn.onclick = () => this.setFilter('folder', folder);
                    btn.innerHTML = `<span class="flex items-center gap-1.5 truncate"><i data-lucide="folder" class="w-3.5 h-3.5 shrink-0 text-slate-400"></i> ${folder}</span> <span class="text-[10px] opacity-60 font-bold">${count}</span>`;
                    folderList.appendChild(btn);
                });

                // Render Tags Layout chips
                tagList.innerHTML = Object.keys(tagsMap).length === 0 
                    ? '<p class="text-xs text-slate-400 px-1 italic">No tags assigned</p>' 
                    : '';
                Object.entries(tagsMap).sort().forEach(([tag, count]) => {
                    const chip = document.createElement('button');
                    const isActive = this.currentFilter === `tag:${tag}`;
                    chip.className = `px-2.5 py-1 text-xs rounded-xl border transition-all cursor-pointer font-medium ${isActive ? 'bg-indigo-600 border-indigo-600 text-white shadow-xs' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`;
                    chip.onclick = () => this.setFilter('tag', tag);
                    chip.innerHTML = `#${tag} <span class="opacity-60 text-[10px] font-bold ml-0.5">${count}</span>`;
                    tagList.appendChild(chip);
                });
            }
        }

        // Initialize to window level mapping
        document.addEventListener('DOMContentLoaded', () => {
            window.portal = new CopyPortal();
        });
    </script>
</body>
</html>
